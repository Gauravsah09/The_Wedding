services:
  - type: web
    name: ritu-weds-gaurav
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Single-Page Application client routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Long-term cache for versioned assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Audio streaming headers with byte-range requests
      - path: /audio/*
        name: Accept-Ranges
        value: bytes
      - path: /audio/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      # Prevent caching of index.html so updates are instant
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
